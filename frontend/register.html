<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BookStack - Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #e0f2f7; /* Light blue background */
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column; /* Allow content to stack */
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Full viewport height */
      margin: 0;
      padding-top: 50px; /* Space for the header */
    }
    .header-brand {
        margin-bottom: 30px;
        color: #007bff; /* Consistent blue color */
        display: flex;
        align-items: center;
        font-size: 2.2rem;
        font-weight: bold;
    }
    .header-brand img {
        height: 50px;
        margin-right: 15px;
    }
    .register-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .register-container h2 {
      color: #007bff; /* Consistent blue for register heading */
      margin-bottom: 30px;
      font-weight: bold;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-primary { /* Changed from .btn-success to .btn-primary for color consistency */
      background-color: #007bff;
      border-color: #007bff;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1.1rem;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }
    .btn-link {
      color: #007bff;
      text-decoration: none;
    }
    .btn-link:hover {
      text-decoration: underline;
    }
    /* Styles for custom message box */
    .custom-message-box {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1050; /* Ensure it's above everything */
        max-width: 400px;
        width: 90%; /* Responsive width */
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }
    .custom-message-box.show {
        opacity: 1;
    }
    .custom-message-box .btn-close {
        color: inherit; /* Use alert's text color */
        opacity: 0.8;
    }
    .custom-message-box.alert-success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
    .custom-message-box.alert-info    { background-color: #d1ecf1; color: #0c5460; border-color: #bee5eb; }
    .custom-message-box.alert-warning { background-color: #fff3cd; color: #856404; border-color: #ffeeba; }
    .custom-message-box.alert-danger  { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    .custom-message-box.alert-primary { background-color: #cce5ff; color: #004085; border-color: #b8daff; }
  </style>
</head>
<body>

<div class="header-brand">
    <img src="logo.png" alt="BookStack Logo" />
    BookStack
</div>

<div class="register-container">
  <h2>Create Your BookStack Account</h2> <!-- Changed heading here -->
  <form id="registerForm">
    <div class="mb-3">
      <input type="text" class="form-control" id="registerUsername" placeholder="Username" required />
    </div>
    <div class="mb-3">
      <input type="email" class="form-control" id="registerEmail" placeholder="Email" required />
    </div>
    <div class="mb-4">
      <input type="password" class="form-control" id="registerPassword" placeholder="Password" required />
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="mt-3">Already have an account? <a href="login.html" class="btn-link">Login here</a></p>
</div>

<!-- Custom Message Box Container -->
<div id="messageBoxContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Get references to key DOM elements
  const registerForm = document.getElementById('registerForm');
  const messageBoxContainer = document.getElementById('messageBoxContainer');

  // Event listener for Register Form Submission
  registerForm.addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent default form submission

    const username = document.getElementById('registerUsername').value; // Get username
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;

    // Simulate registration success. In a real app, send to backend and handle response.
    displayMessage('Registered successfully! Redirecting to BookStack...', 'alert-success');
    setTimeout(() => {
        // Redirect to index.html and simulate login with the registered username
        window.location.href = `index.html?loggedIn=true&username=${encodeURIComponent(username)}`;
    }, 1000);
  });

  /**
   * Displays a custom message box instead of native alert().
   * Appends it to the body and removes after a delay.
   * @param {string} message - The message to display.
   * @param {string} type - Bootstrap alert type (e.g., 'alert-success', 'alert-info', 'alert-danger').
   */
  function displayMessage(message, type = 'alert-info') {
    const messageBox = document.createElement('div');
    messageBox.className = `custom-message-box alert ${type}`;
    messageBox.innerHTML = `
      <span>${message}</span>
      <button type="button" class="btn-close" aria-label="Close"></button>
    `;

    messageBoxContainer.appendChild(messageBox); // Append to the dedicated container

    // Add event listener to close button
    messageBox.querySelector('.btn-close').addEventListener('click', () => {
      messageBox.classList.remove('show');
      messageBox.addEventListener('transitionend', () => messageBox.remove(), { once: true });
    });

    // Show with fade effect
    setTimeout(() => messageBox.classList.add('show'), 10); // Small delay for transition

    // Hide after a delay
    setTimeout(() => {
      messageBox.classList.remove('show');
      messageBox.addEventListener('transitionend', () => messageBox.remove(), { once: true });
    }, 3000); // Message disappears after 3 seconds
  }
</script>
</body>
</html>
